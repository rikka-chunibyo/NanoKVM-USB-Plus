name: Build Browser and Desktop Apps

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload downloadable builds using Actions artifact storage
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: browser/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload browser bundle
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@v6
        with:
          name: browser-dist
          path: browser/dist
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Browser Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the Compose image
        run: docker compose build
      - name: Check that nginx serves the browser app
        run: |
          container=$(docker run --detach --rm --publish 127.0.0.1::80 nanokvm-usb-plus:local)
          trap 'docker stop "$container" >/dev/null' EXIT
          address=$(docker port "$container" 80/tcp)
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused \
            "http://$address/" -o browser-index.html
          grep -F 'id="root"' browser-index.html

  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            command: build:linux
            installer: desktop/dist/*.AppImage
          - platform: windows
            runner: windows-latest
            command: build:win
            installer: desktop/dist/*.exe
          - platform: macos
            runner: macos-latest
            command: build:mac
            installer: desktop/dist/*.dmg
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libudev-dev
      - run: npm ci
      - name: Build desktop installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          BUILD_COMMAND: ${{ matrix.command }}
        run: npm run "$BUILD_COMMAND"
      - name: Upload desktop installer
        if: github.event_name == 'workflow_dispatch' && inputs.upload_artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 3
