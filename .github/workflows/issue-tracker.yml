name: Issue Tracker

on:
  issues:
    types: [opened, reopened, closed]

permissions: {}

jobs:
  track-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Send issue data to the configured API
        env:
          API_URL: ${{ secrets.ISSUE_TRACKER_API_URL }}
          VERIFY_TOKEN: ${{ secrets.VERIFY_TOKEN }}
        run: |
          if [[ -z "$API_URL" || -z "$VERIFY_TOKEN" ]]; then
            echo "Issue tracker integration is not configured."
            exit 0
          fi

          payload=$(jq -c '{
            action,
            issue: (.issue | {
              id,
              number,
              title,
              body: (.body // ""),
              state,
              created_at,
              updated_at,
              closed_at: (.closed_at // ""),
              url: .html_url,
              user: (.user | {login}),
              labels,
              assignees
            }),
            repository: {name: .repository.full_name}
          }' "$GITHUB_EVENT_PATH")

          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --proto '=https' --max-time 20 --request POST "$API_URL" \
            --header 'Content-Type: application/json' \
            --header "Token: $VERIFY_TOKEN" --data-binary "$payload")

          if [[ "$status" != 2?? ]]; then
            echo "::error::Issue tracker returned HTTP $status"
            exit 1
          fi
